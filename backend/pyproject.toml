[project]
name = "blue-tender-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "selectolax>=0.3",
  "pdfplumber>=0.11",
  "pyyaml>=6.0",
  "supabase>=2.7",
  "anthropic>=0.40",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
