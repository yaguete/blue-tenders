# Frases con las que se busca la cuenca. «north sea» es un concepto, no «north» y «sea».
names:
  north_sea: [north sea, mar del norte, mer du nord]
  baltic: [baltic sea, mar Báltico, mer Baltique]
  black_sea: [black sea, mar Negro, mer Noire]
  mediterranean: [mediterranean sea, mar Mediterráneo, mer Méditerranée]
  atlantic: [atlantic ocean, océano Atlántico, océan Atlantique]
  arctic: [arctic ocean, océano Ártico]
