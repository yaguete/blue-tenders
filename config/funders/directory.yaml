# Perfiles sin convocatoria con plazo. El ticket se deja vacío si no está
# publicado en la página enlazada: no se rellena de memoria.
- id: eib
  name: European Investment Bank
  kind: development_bank
  url: https://www.eib.org/en/products/index.htm
  summary: Loans and guarantees for large projects, including energy and maritime infrastructure. Not a call with a deadline.
  instruments: [loan]
  geographies: [EU]
  subsectors: [offshore-wind, green-ports, subsea-cables]
  last_verified: "2026-11-11"
- id: blueinvest
  name: BlueInvest
  kind: development_bank
  url: https://maritime-forum.ec.europa.eu/theme/blueinvest_en
  summary: Readiness and fundraising assistance for EU blue-economy SMEs, backed by the EIB and the Commission. Registration is continuous.
  instruments: [technical_assistance, equity]
  geographies: [EU27]
  subsectors: [offshore-wind, ocean-energy]
  last_verified: "2026-11-11"
- id: investeu
  name: InvestEU
  kind: development_bank
  url: https://investeu.europa.eu/
  summary: EU guarantee programme implemented by the EIB and other partners. Access is through financial intermediaries, not a single call.
  instruments: [loan, equity]
  geographies: [EU]
  subsectors: []
  last_verified: "2026-11-11"
- id: innovation-fund
  name: Innovation Fund
  kind: eu
  url: https://climate.ec.europa.eu/eu-action/eu-funding-climate-action/innovation-fund_en
  summary: Grants for demonstration of low-carbon tech, including some maritime projects. Live calls are indexed separately when the portal publishes them.
  instruments: [grant]
  geographies: [EU27, EEA]
  subsectors: [offshore-wind, fleet-decarbonisation, offshore-hydrogen]
  last_verified: "2026-11-11"
- id: cdti
