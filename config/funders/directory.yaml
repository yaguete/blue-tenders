  instruments: [grant]
  geographies: [ES]
  subsectors: [offshore-wind, green-ports, fleet-decarbonisation]
  last_verified: "2026-11-11"
- id: enisa
  name: ENISA
  kind: national
  url: https://www.enisa.es/
